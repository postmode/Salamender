[package]
name = "tauri-cell"
version = "1.5.0"
edition = "2021"
description = "Universal Cell Engine v1.5 — Tauri tissue shard (real code; not compiled in the v1.5 sandbox)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
